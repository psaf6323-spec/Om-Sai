let S;try{S=JSON.parse(localStorage.getItem('aanchal')||'null')}catch(e){}
S=S||{users:{admin:{pw:'admin123',role:'admin'},staff:{pw:'staff123',role:'staff'}},products:[],sales:[],exp:[],qr:{esewa:'',bank:''},seq:0};
S.orders=S.orders||[];S.parties=S.parties||[];S.lang=S.lang||'en';S.shop=S.shop||[];S.cats=S.cats||['Grocery','Snacks','Drinks','Stationery','Household','Cosmetics','Other'];S.logo=S.logo||'';
const t=k=>D[k]?D[k][S.lang=='np'?1:0]:k,$=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0');

/* Nepali (BS) calendar */
const BD={2081:[31,32,31,32,31,30,30,30,29,29,30,31],2082:[31,31,32,31,31,31,30,29,30,29,30,30],2083:[31,31,32,32,31,30,30,30,29,30,30,30]};
const MN=['Baishakh','Jestha','Ashadh','Shrawan','Bhadra','Ashwin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'],MP=['बैशाख','जेठ','असार','श्रावण','भदौ','असोज','कार्तिक','मंसिर','पुष','माघ','फागुन','चैत'];
const WD=[['Su','Mo','Tu','We','Th','Fr','Sa'],['आ','सो','मं','बु','बि','शु','श']];
function todayBS(){const n=new Date();let d=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2024,3,13))/864e5);
 for(const y of [2081,2082,2083]){for(let m=0;m<12;m++){if(d<BD[y][m])return[y,m+1,d+1];d-=BD[y][m]}}return[2083,12,30]}
const T=todayBS().map(p2).join('-');
function dow(y,m){let o=0;for(let a=2081;a<y;a++)o+=BD[a].reduce((s,x)=>s+x,0);for(let i=0;i<m-1;i++)o+=BD[y][i];return(6+o)%7}
const CS={};
function dp(id,v){return `<div style="position:relative"><input readonly id="${id}" value="${v||T}" onclick="oc('${id}')"><div class="cp" id="${id}_p" hidden></div></div>`}
const gdp=id=>$(id).value;
function oc(id){const v=$(id).value.split('-').map(Number);CS[id]={y:v[0],m:v[1]};rc(id)}
function rc(id){const{y,m}=CS[id],n=BD[y][m-1],f=dow(y,m),l=S.lang=='np'?1:0;let h=`<div class="ch"><button class="s" onclick="cm('${id}',-1)">‹</button><b>${l?MP[m-1]:MN[m-1]} ${nd(y)}</b><button class="s" onclick="cm('${id}',1)">›</button></div><div class="cg">`+WD[l].map(d=>`<i>${d}</i>`).join('');
 for(let i=0;i<f;i++)h+='<span></span>';for(let d=1;d<=n;d++)h+=`<button class="s ${y+'-'+p2(m)+'-'+p2(d)==T?'td':''}" onclick="pk('${id}',${d})">${nd(d)}</button>`;$(id+'_p').innerHTML=h+'</div>';$(id+'_p').hidden=false}
function cm(id,k){let{y,m}=CS[id];m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}if(!BD[y])return;CS[id]={y,m};rc(id)}
function pk(id,d){const{y,m}=CS[id];$(id).value=`${y}-${p2(m)}-${p2(d)}`;$(id+'_p').hidden=true}
/* helpers */
const logo=()=>S.logo?`<img class="lg" src="${S.logo}">`:'';
const szl=z=>z?t({S:'small',M:'medium',L:'large'}[z]):'';
function sh(d){return S.shop.find(x=>x.d==d)}
function hrs(x){if(!x||x.st!='open'||!x.o||!x.c)return 0;const a=x.o.split(':'),c=x.c.split(':');return Math.max(0,(c[0]*60+ +c[1])-(a[0]*60+ +a[1]))/60}
function nextRent(){let[y,m]=T.split('-').map(Number);const cur=`${y}-${p2(m)}`;for(let i=0;i<24;i++){const k=`${y}-${p2(m)}`;if(!S.exp.some(e=>e.c=='rent'&&e.pm==k))return{cur:k==cur,y,m};m++;if(m>12){m=1;y++}}return null}
function rentBox(){const r=nextRent();if(!r)return'';const n=(S.lang=='np'?MP:MN)[r.m-1]+' '+nd(r.y);return r.cur?`<div class="card" style="cursor:pointer;border-color:var(--rd)" onclick="go('exp')"><b class="red">${t('rentdue')}: ${n}</b></div>`:`<div class="card k">${t('rentnext')}: ${n}</div>`}
function shopBox(){const x=sh(T);return `<div class="card k" style="cursor:pointer" onclick="go('shop')">${t('shop')}: ${x?(x.st=='open'?t('open')+' '+(x.o||'')+(x.c?' – '+x.c:''):`<span class="red">${t('closed')}: ${x.r||''}</span>`):'—'}</div>`}

const rs=n=>(S.lang=='np'?'रु ':'Rs ')+nd((Math.round(n*100)/100).toLocaleString('en-IN')),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const pcs=p=>p.packets*p.ppp-(p.sold||0)-(p.dmg||0);
const payd=s=>s.pays||[{a:s.amt,m:'cash',d:s.date}],paid=s=>sum(payd(s),x=>x.a);
const col=(pre,m)=>sum(S.sales,s=>sum(payd(s).filter(x=>x.d.startsWith(pre)&&(!m||x.m==m)),x=>x.a));
const bakiL=()=>S.sales.filter(s=>paid(s)<s.amt-.001),pdue=q=>sum(q.led,x=>x.k=='b'?x.a:-x.a);
const nm=(p,n)=>p.name.toLowerCase()==n||(p.ln||'').toLowerCase()==n;
function prev(n,z){n=n.trim().toLowerCase();const l=S.products.filter(p=>nm(p,n)&&(z===undefined||(p.size||'')==z)).pop();return l?`${l.size?szl(l.size)+': ':''}Rs ${l.cpp}/pc · Rs ${l.cp}/${t('pk')} · ${t('spc')} Rs ${l.sp} (${l.date}, ${t('batch')} ${l.bn||1})`:'—'}
function pvw(){$('pv0').innerHTML=t('prevr')+': '+prev($('n').value,$('sz').value)}
const oos=()=>S.products.filter((p,i,a)=>{const k=x=>x.name.toLowerCase()+'|'+(x.size||'');return pcs(p)<=0&&a.filter(x=>k(x)==k(p)).every(x=>pcs(x)<=0)&&a.findIndex(x=>k(x)==k(p))==i});
let CSEL='';
function sg(){const v=$('cs').value.trim().toLowerCase(),b=$('sgl');if(!v){b.hidden=true;return}const m=S.products.filter(p=>(p.name+' '+(p.ln||'')+' '+p.code).toLowerCase().includes(v)),seen={},l=[],k=x=>x.name.toLowerCase()+'|'+(x.size||'');m.forEach(p=>{if(!seen[k(p)]){seen[k(p)]=1;const e=m.filter(x=>k(x)==k(p));l.push(e.find(x=>pcs(x)>0)||e[0])}});b.hidden=!l.length;b.innerHTML=l.slice(0,8).map(p=>`<div onclick="pick('${p.code}')"><b>${p.name}</b> ${szl(p.size)} ${p.ln||''}<br><span class="k">${rs(p.sp)} · ${t('instock')} ${sum(S.products.filter(x=>k(x)==k(p)),pcs)}</span></div>`).join('')}

function rmd(){const GO={oos:'tobe',tbo:'tobe',awd:'ord',baki:'coll',due:'party'},b=(k,a,c)=>a.length?`<div class="${k=='oos'||k=='baki'?'bk':'card'}" style="cursor:pointer" onclick="go('${GO[k]}')"><b class="red">${t(k)} (${nd(a.length)})</b><br>${a.map(c).join(', ')}</div>`:'';
 return b('oos',oos(),p=>p.name)+b('tbo',S.orders.filter(x=>x.st=='tobe'),x=>x.name)+b('awd',S.orders.filter(x=>x.st=='ord'),x=>x.name)+b('baki',bakiL(),s=>`${s.cust.n} ${rs(s.amt-paid(s))}`)+b('due',S.parties.filter(q=>pdue(q)>0),q=>`${q.name} ${rs(pdue(q))}`)+rentBox()+shopBox()}
